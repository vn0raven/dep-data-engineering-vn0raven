name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/pages.yml"

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Observatory demo publish tree
        shell: bash
        run: |
          diff -u <(printf '%s\n' dashboard/observatory/{app.js,index.html,style.css}) \
            <(git ls-files -- dashboard/observatory)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/
          name: pages-${{ github.run_attempt }}

      - name: Wait for uploaded artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" \
              --jq "[.artifacts[] | select(.name == \"$ARTIFACT_NAME\")] | length")
            if [ "$count" = "1" ]; then exit 0; fi
            sleep 5
          done
          echo "Expected exactly one visible Pages artifact" >&2
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_attempt }}
